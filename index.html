<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求职辅导 · 学员进度管理</title>
<style>
:root{
  --primary:#4f46e5; --primary-light:#eef2ff; --primary-dark:#4338ca;
  --bg:#f6f7fb; --card:#ffffff; --border:#e5e7eb; --text:#1f2937; --text2:#6b7280;
  --green:#059669; --green-bg:#ecfdf5; --amber:#d97706; --amber-bg:#fffbeb;
  --red:#dc2626; --red-bg:#fef2f2; --blue:#2563eb; --blue-bg:#eff6ff;
  --purple:#7c3aed; --purple-bg:#f5f3ff; --gray-bg:#f3f4f6;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
button{cursor:pointer;font-size:14px}
input,select,textarea{font-size:14px;color:var(--text)}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);padding:20px 12px;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:10}
.logo{display:flex;align-items:center;gap:10px;padding:6px 12px 22px}
.logo-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
.logo-text{font-weight:700;font-size:15px;line-height:1.3}
.logo-text small{display:block;font-weight:400;color:var(--text2);font-size:11px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text2);margin-bottom:4px;border:none;background:none;width:100%;text-align:left;font-size:14px}
.nav-item:hover{background:var(--gray-bg);color:var(--text)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.nav-item .ico{width:20px;text-align:center}
.sidebar-footer{margin-top:auto;padding:12px;font-size:12px;color:var(--text2)}
.sidebar-footer button{display:block;width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text2);font-size:12px}
.sidebar-footer button:hover{border-color:var(--primary);color:var(--primary)}
.main{flex:1;margin-left:220px;padding:24px 28px;max-width:1400px}

.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:700}
.page-sub{color:var(--text2);font-size:13px;margin-top:4px}

/* ===== 通用组件 ===== */
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:500;transition:.15s}
.btn:hover{border-color:#c7cbd4;background:#fafafa}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-danger{color:var(--red);border-color:#fecaca}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-ghost{border:none;background:none;color:var(--primary);padding:5px 8px;font-size:13px}
.btn-ghost:hover{background:var(--primary-light);border-radius:6px}
.btn-ghost.danger{color:var(--red)}
.btn-ghost.danger:hover{background:var(--red-bg)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-box{position:relative}
.search-box input{padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:9px;width:240px;background:#fff;outline:none}
.search-box input:focus{border-color:var(--primary)}
.search-box::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.55}
select.filter{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;outline:none}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px;font-size:12px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);background:#fafbfc;white-space:nowrap}
th:first-child{border-top-left-radius:var(--radius)}
th:last-child{border-top-right-radius:var(--radius)}
td{padding:13px 16px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbff}
.empty{text-align:center;padding:48px 20px;color:var(--text2)}
.empty .big{font-size:36px;margin-bottom:10px}

.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.tag-gray{background:var(--gray-bg);color:var(--text2)}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-amber{background:var(--amber-bg);color:var(--amber)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}
.tag-indigo{background:var(--primary-light);color:var(--primary)}

.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;flex-shrink:0}

/* ===== 仪表盘 ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat-card .num{font-size:28px;font-weight:700;margin:6px 0 2px}
.stat-card .lbl{color:var(--text2);font-size:13px}
.stat-card .ico{font-size:18px}
.dash-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px}
@media(max-width:1000px){.dash-grid{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-head{padding:16px 18px;border-bottom:1px solid #f0f1f4;font-weight:600;font-size:15px}
.panel-body{padding:16px 18px}
.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.funnel-label{width:58px;font-size:13px;color:var(--text2);flex-shrink:0}
.funnel-bar-wrap{flex:1;background:var(--gray-bg);border-radius:6px;height:22px;overflow:hidden}
.funnel-bar{height:100%;border-radius:6px;transition:width .5s;min-width:2px}
.funnel-num{width:32px;text-align:right;font-weight:600;font-size:13px}
.funnel-conv{font-size:11.5px;color:var(--text2);padding:1px 0 7px 68px}
.funnel-conv b{color:var(--text);font-weight:600}
.funnel-overall{margin-top:8px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px;color:var(--text2)}
.funnel-overall b{color:#059669;font-size:15px;font-weight:700}
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f5f6f8;font-size:13px;align-items:flex-start}
.activity-item:last-child{border-bottom:none}
.activity-time{color:var(--text2);font-size:12px;white-space:nowrap;padding-top:2px}

/* ===== 看板 ===== */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:16px;align-items:flex-start}
.kb-col{min-width:230px;width:230px;flex-shrink:0;background:#eef0f5;border-radius:var(--radius);padding:10px}
.kb-col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-weight:600;font-size:13.5px}
.kb-count{background:#fff;border-radius:99px;padding:1px 8px;font-size:12px;color:var(--text2);font-weight:500}
.kb-cards{min-height:60px;display:flex;flex-direction:column;gap:8px}
.kb-col.drag-over .kb-cards{outline:2px dashed var(--primary);outline-offset:2px;border-radius:8px}
.kb-card{background:#fff;border-radius:10px;padding:12px;box-shadow:var(--shadow);cursor:grab;border:1px solid transparent;transition:.15s}
.kb-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.kb-card.dragging{opacity:.45}
.kb-card .stu{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.kb-card .job{color:var(--text2);font-size:12.5px;margin-bottom:8px;line-height:1.45}
.kb-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--text2)}
.kb-card .next{margin-top:7px;background:var(--amber-bg);color:var(--amber);font-size:11.5px;padding:4px 8px;border-radius:6px;line-height:1.4}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

/* 学员卡片视图 & 视图切换 */
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-shrink:0}
.vt-btn{border:none;background:#fff;padding:7px 12px;font-size:13px;color:var(--text2);cursor:pointer}
.vt-btn.active{background:var(--primary);color:#fff}
.stu-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.stu-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;transition:.15s}
.stu-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(79,70,229,.1)}
.stu-card .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stu-card .nm{font-weight:600;font-size:14px;line-height:1.2}
.stu-card .sc{font-size:12px;color:var(--text2);margin-top:2px}
.stu-card .tg{font-size:13px;color:var(--text);margin:6px 0 10px}
.stu-card .row{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12.5px;color:var(--text2)}
.stu-card .acts{display:flex;gap:6px;margin-top:12px;border-top:1px solid #f0f1f4;padding-top:10px}
.stu-card .acts .btn-ghost{flex:1;text-align:center;padding:6px 0;font-size:12.5px}

/* 看板卡片内阶段下拉 */
.kb-select{width:100%;margin-top:8px;padding:5px 7px;font-size:12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text2);cursor:pointer}

/* 职位库行可点击编辑 */
#jobTable tbody tr{cursor:pointer}
#jobTable tbody tr:hover td:first-child{color:var(--primary)}
#jobTable .job-row-actions{white-space:nowrap}
#jobTable .job-row-actions button{cursor:pointer;position:relative;z-index:1}
/* ===== 学员管理：主从布局（学员全景） ===== */
.stu-master{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start;margin-top:16px}
.stu-list-col{max-height:calc(100vh - 210px);overflow-y:auto;padding:8px}
.stu-detail-col{position:sticky;top:16px}
.stu-detail-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.sd-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sd-head .nm{font-weight:700;font-size:16px;line-height:1.2}
.sd-stats{display:flex;gap:10px;margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid #f0f1f4}
.sd-stats>div{flex:1;background:var(--gray-bg);border-radius:10px;padding:10px 12px;text-align:center}
.sd-stats b{display:block;font-size:18px;font-weight:700;color:var(--text)}
.sd-stats span{font-size:12px;color:var(--text2)}

/* 左侧紧凑学员列表 */
.stu-list{display:flex;flex-direction:column;gap:6px}
.stu-list-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.12s;border:1px solid transparent;min-width:0}
.stu-list-row:hover{background:#f8f9fc}
.stu-list-row.selected{background:var(--primary-light);border-color:rgba(99,102,241,.35)}
.stu-list-row .avatar{flex-shrink:0}
.stu-list-row .info{flex:1;min-width:0}
.stu-list-row .nm{font-weight:600;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-list-row .sub{font-size:12px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-list-row .meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stu-list-row .badge{font-size:11px;background:#fff;border:1px solid var(--border);border-radius:99px;padding:1px 7px;color:var(--text2)}

/* 左侧卡片视图（窄列单卡片） */
.stu-cards-narrow{display:flex;flex-direction:column;gap:8px}
.stu-card-narrow{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:.12s}
.stu-card-narrow:hover{border-color:var(--primary)}
.stu-card-narrow.selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(99,102,241,.25)}
.stu-card-narrow .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stu-card-narrow .nm{font-weight:600;font-size:14px}
.stu-card-narrow .sub{font-size:12px;color:var(--text2);margin-top:1px}
.stu-card-narrow .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--text2)}
.stu-card-narrow .acts{display:flex;gap:6px;margin-top:10px;border-top:1px solid #f0f1f4;padding-top:9px}
.stu-card-narrow .acts .btn-ghost{flex:1;text-align:center;padding:5px 0;font-size:12px}

.stu-detail-col .empty{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:10px}
.stu-detail-col .empty .big{font-size:40px}
@media(max-width:960px){
  .stu-master{grid-template-columns:1fr}
  .stu-list-col{max-height:none;padding:14px}
  .stu-detail-col{position:static}
  .stu-detail-card{margin-top:4px}
}
[data-theme="dark"] .stu-list-row:hover{background:#1c2027}
[data-theme="dark"] .stu-list-row.selected{background:rgba(99,102,241,.18)}
[data-theme="dark"] .stu-card-narrow{background:var(--card);border-color:var(--border)}

/* ===== 视觉提质 ===== */
.logo-icon{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(99,102,241,.35)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4);z-index:300}
.stat-bar{height:4px;border-radius:99px;background:var(--gray-bg);margin-top:11px;overflow:hidden}
.stat-bar>i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.dist-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px}
.dist-row:last-child{margin-bottom:0}
.dist-row .lbl{width:60px;color:var(--text2);flex-shrink:0}
.dist-bar{flex:1;height:10px;border-radius:99px;background:var(--gray-bg);overflow:hidden}
.dist-bar>i{display:block;height:100%;border-radius:99px}
.dist-num{width:30px;text-align:right;font-weight:600;font-size:12.5px}
.kb-card{position:relative}
.kb-edit{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:7px;padding:3px 9px;font-size:11.5px;color:var(--primary);opacity:0;transition:.15s;cursor:pointer;box-shadow:var(--shadow)}
.kb-card:hover .kb-edit{opacity:1}
#syncStatus{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
#syncStatus .sdot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex-shrink:0}
#syncStatus.feishu .sdot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}

/* ===== 暗色主题 ===== */
[data-theme="dark"]{
  --bg:#0f1115; --card:#181b21; --border:#2a2f3a; --text:#e6e8ed; --text2:#98a1b3;
  --gray-bg:#1c2027; --shadow:0 1px 3px rgba(0,0,0,.45); --shadow-lg:0 12px 34px rgba(0,0,0,.6);
}
[data-theme="dark"] body{background:var(--bg)}
[data-theme="dark"] .sidebar{background:#14171c}
[data-theme="dark"] .stat-card,.panel,.card,.modal,.stu-card,.kb-card{background:var(--card);border-color:var(--border)}
[data-theme="dark"] .kb-col{background:#1c2027}
[data-theme="dark"] .drawer{background:var(--card)}
[data-theme="dark"] input,[data-theme="dark"] .fld input,[data-theme="dark"] .fld select,[data-theme="dark"] .fld textarea,[data-theme="dark"] select.filter,[data-theme="dark"] .search-box input{background:#1c2027;color:var(--text);border-color:var(--border)}
[data-theme="dark"] th{background:#1a1e25;color:var(--text2)}
[data-theme="dark"] tbody tr:hover{background:#1c2027}
[data-theme="dark"] .file-chip{background:#1d2440;border-color:#3b4a8a}
[data-theme="dark"] .file-chip a{color:#a5b4fc}
[data-theme="dark"] .btn:not(.btn-primary):not(.btn-danger){background:#1c2027}
[data-theme="dark"] .btn:not(.btn-primary):not(.btn-danger):hover{background:#232833}
[data-theme="dark"] .nav-item:hover{background:var(--gray-bg)}
[data-theme="dark"] .nav-item.active{background:rgba(99,102,241,.22);color:#c7d2fe}
[data-theme="dark"] .pf-item,.app-item{background:var(--gray-bg)}
[data-theme="dark"] .drawer-mask,.modal-mask{background:rgba(0,0,0,.6)}
[data-theme="dark"] .tag-gray{background:#262b34}
[data-theme="dark"] .info-grid>div,.drawer-body .sec-title~div{color:var(--text)}
[data-theme="dark"] .modal-head,[data-theme="dark"] .modal-foot,[data-theme="dark"] .drawer-head{border-color:var(--border)}
::placeholder{color:#9ca3af}
[data-theme="dark"] ::placeholder{color:#d1d5db}

/* ===== 顶部栏 / 全局搜索 ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 0 14px;margin-bottom:6px;background:linear-gradient(var(--bg) 72%,rgba(246,247,251,0))}
[data-theme="dark"] .topbar{background:linear-gradient(var(--bg) 72%,rgba(15,17,21,0))}
.crumb{font-size:16px;font-weight:800;color:var(--text);flex-shrink:0}
.crumb small{font-weight:400;color:var(--text2);font-size:12px;margin-left:8px}
.global-search{position:relative;flex:1;max-width:440px}
.gs-input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);border-radius:11px;background:#fff;outline:none}
[data-theme="dark"] .gs-input{background:#0f1218}
.gs-input:focus{border-color:var(--primary)}
.gs-results{position:absolute;top:48px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);max-height:360px;overflow:auto;display:none;z-index:60}
.gs-results.show{display:block}
[data-theme="dark"] .gs-results{background:var(--card)}
.gs-group{padding:7px 14px;font-size:11px;font-weight:700;color:var(--text2);background:var(--gray-bg);letter-spacing:.3px}
.gs-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13.5px}
.gs-item:last-child{border-bottom:none}
.gs-item:hover{background:var(--primary-light)}
.gs-item .gx{font-size:12px;color:var(--text2);margin-left:auto;max-width:50%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-empty{padding:16px;text-align:center;color:var(--text2);font-size:13px}

/* ===== 待跟进提醒 ===== */
.followup{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:1px solid #fed7aa;border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:none;gap:16px;align-items:stretch}
[data-theme="dark"] .followup{background:#241c14;border-color:#5c4422}
.fu-left{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-right:16px;border-right:1px dashed #fdba74;min-width:92px}
.fu-num{font-size:30px;font-weight:800;color:#ea580c;line-height:1}
.fu-lbl{font-size:12px;color:#9a3412;font-weight:600;margin-top:4px}
[data-theme="dark"] .fu-lbl{color:#fbbf24}
.fu-list{flex:1;display:flex;gap:10px;overflow-x:auto;padding-bottom:3px}
.fu-list::-webkit-scrollbar{height:6px}
.fu-list::-webkit-scrollbar-thumb{background:#fdba74;border-radius:9px}
.fu-item{flex-shrink:0;background:#fff;border:1px solid #fde0c4;border-radius:11px;padding:10px 13px;min-width:206px;cursor:pointer;transition:.15s}
.fu-item:hover{border-color:#f97316;box-shadow:0 4px 12px rgba(249,115,22,.16)}
[data-theme="dark"] .fu-item{background:#1c2027;border-color:#5c4422}
.fu-item .fn{font-weight:700;font-size:13.5px}
.fu-item .fd{font-size:12px;color:var(--text2);margin-top:3px}
.fu-item .ft{font-size:11.5px;color:#ea580c;margin-top:5px;font-weight:600}
.fu-item .fd2{font-size:11.5px;color:#b45309;margin-top:2px}
[data-theme="dark"] .fu-item .fd2{color:#fbbf24}
.fu-date{font-size:11.5px;padding:1px 8px;border-radius:20px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;font-weight:600;white-space:nowrap}
.fu-date.overdue{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.fu-date.today{background:#fff7ed;color:#ea580c;border-color:#fed7aa}
.fu-date.soon{background:#fffbeb;color:#b45309;border-color:#fde68a}
.fu-date.none{background:#f8fafc;color:#94a3b8;border-color:#e2e8f0}
.fu-done{font-size:11.5px;padding:2px 10px;border-radius:20px;border:1px solid #bbf7d0;background:#f0fdf4;color:#16a34a;cursor:pointer;font-weight:600;transition:.15s}
.fu-done:hover{background:#dcfce7;border-color:#86efac}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 16px;overflow-y:auto}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid #f0f1f4;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px}
.modal-close{border:none;background:none;font-size:20px;color:var(--text2);line-height:1}
.modal-body{padding:20px 22px;max-height:64vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid #f0f1f4;display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.fld label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:5px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;outline:none;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary)}
.fld textarea{resize:vertical;min-height:66px}
.upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.up-status{font-size:12px;color:var(--text2)}
.file-chip{display:flex;align-items:center;gap:8px;margin-top:8px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:9px;padding:7px 10px;font-size:13px}
.file-chip a{color:#4338ca;text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-chip .chip-x{border:none;background:transparent;color:#ef4444;cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.file-chip .chip-x:hover{color:#b91c1c}

/* ===== 详情抽屉 ===== */
.drawer-mask{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:90;display:none}
.drawer-mask.show{display:block}
.drawer{position:fixed;top:0;right:-620px;width:600px;max-width:94vw;height:100vh;background:#fff;z-index:95;box-shadow:var(--shadow-lg);transition:right .25s ease;display:flex;flex-direction:column}
.drawer.show{right:0}
.drawer-head{padding:20px 24px;border-bottom:1px solid #f0f1f4;display:flex;justify-content:space-between;align-items:center}
.drawer-body{flex:1;overflow-y:auto;padding:20px 24px}
.sec-title{font-size:13px;font-weight:700;color:var(--text2);margin:20px 0 10px;text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center}
.sec-title:first-child{margin-top:0}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:13.5px}
.info-grid .k{color:var(--text2);font-size:12px;margin-bottom:2px}
.pf-item,.app-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;gap:10px}
.pf-item .t{font-weight:500;font-size:13.5px}
.pf-item .u{font-size:12px;color:var(--text2);word-break:break-all}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:10px 20px;border-radius:99px;font-size:13.5px;z-index:200;opacity:0;transition:.25s;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:820px){
  .sidebar{width:64px;padding:16px 8px}
  .logo-text,.nav-item span.txt,.sidebar-footer{display:none}
  .main{margin-left:64px;padding:16px}
  .form-grid{grid-template-columns:1fr}
  .nav-item:hover{transform:none}
}

/* ============================================================
   颜值翻新 · 统一设计语言 + 侧边栏升级 + 微动效
   (在原始设计系统之上叠加，保留全部功能与类名)
   ============================================================ */
:root{
  --primary:#6366f1; --primary-light:#eef2ff; --primary-dark:#4f46e5;
  --bg:#f5f6fb; --card:#ffffff; --border:#eceef4; --text:#1e2230; --text2:#6e7689;
  --green:#059669; --green-bg:#ecfdf5; --amber:#d97706; --amber-bg:#fffbeb;
  --red:#dc2626; --red-bg:#fef2f2; --blue:#2563eb; --blue-bg:#eff6ff;
  --purple:#7c3aed; --purple-bg:#f5f3ff; --gray-bg:#f1f2f6;
  --shadow:0 1px 2px rgba(20,24,48,.04), 0 6px 16px rgba(20,24,48,.05);
  --shadow-lg:0 20px 48px rgba(43,39,98,.14);
  --shadow-sm:0 1px 3px rgba(20,24,48,.06);
  --radius:14px; --radius-lg:18px; --radius-sm:10px;
  --grad:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#a855f7);
  --grad-soft:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.12));
  --ease:cubic-bezier(.22,.61,.36,1);
}
/* 顶部品牌条更细腻 */
body::before{height:3px;background:var(--grad);box-shadow:0 1px 8px rgba(99,102,241,.35)}

/* ===== 侧边栏升级 ===== */
.sidebar{box-shadow:1px 0 0 var(--border), 8px 0 30px rgba(67,56,202,.05);border-right:none}
.logo-icon{background:var(--grad);box-shadow:0 8px 18px rgba(99,102,241,.4)}
.logo-text{letter-spacing:.2px}
.nav-item{position:relative;overflow:hidden;font-weight:500;border-radius:11px;transition:background .2s var(--ease),color .2s,transform .18s var(--ease)}
.nav-item .ico{display:inline-block;transition:transform .3s var(--ease)}
.nav-item:hover{transform:translateX(3px);background:var(--gray-bg)}
.nav-item:hover .ico{transform:scale(1.15) rotate(-5deg)}
.nav-item.active{background:linear-gradient(90deg,var(--primary-light),rgba(99,102,241,.06));color:var(--primary);font-weight:700}
.nav-item.active .ico{transform:scale(1.12)}
.nav-item::after{content:"";position:absolute;left:0;top:50%;height:58%;width:3px;border-radius:0 4px 4px 0;background:var(--grad);transform:translateY(-50%) scaleY(0);transition:transform .3s var(--ease)}
.nav-item.active::after{transform:translateY(-50%) scaleY(1)}
.sidebar-footer button{font-weight:500;transition:.18s var(--ease),border-color .18s,color .18s}
.sidebar-footer button:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(99,102,241,.12)}

/* ===== 顶部栏玻璃质感 ===== */
.topbar{padding:14px 0 16px;margin-bottom:8px;background:linear-gradient(var(--bg) 70%,rgba(245,246,251,0))}
.crumb{letter-spacing:.3px}
.gs-input:focus{box-shadow:0 0 0 3px var(--primary-light)}

/* ===== 通用组件的微动效 ===== */
.btn{transition:transform .12s var(--ease),box-shadow .2s,background .2s,border-color .2s}
.btn:hover{box-shadow:0 4px 12px rgba(20,24,48,.08)}
.btn:active{transform:scale(.96)}
.btn-primary{box-shadow:0 6px 16px rgba(99,102,241,.28)}
.btn-primary:hover{box-shadow:0 8px 22px rgba(99,102,241,.36);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.96) translateY(0)}
.btn-ghost{transition:background .15s,color .15s,transform .12s}
.btn-ghost:active{transform:scale(.94)}
.tag{transition:transform .15s var(--ease)}
.tag:hover{transform:translateY(-1px)}

/* 卡片 / 面板悬浮抬升 */
.card,.panel{border-color:var(--border);transition:box-shadow .3s var(--ease),transform .3s var(--ease),border-color .3s}
.panel-head{font-size:15px;letter-spacing:.2px}
.stat-card{transition:box-shadow .3s var(--ease),transform .3s var(--ease),border-color .3s;animation:cardIn .5s var(--ease) both}
.stat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:transparent}
.stat-card .ico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;background:var(--grad-soft);font-size:18px;margin-bottom:4px;transition:transform .3s var(--ease)}
.stat-card:hover .ico{transform:scale(1.08) rotate(-4deg)}

/* 输入框聚焦光环 */
.fld input:focus,.fld select:focus,.fld textarea:focus,.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}

/* 看板卡片按压 */
.kb-card:active{transform:scale(.985)}
.kb-card .kb-edit:hover{background:#fff;color:var(--primary)}

/* 学员主从列表悬浮 */
.stu-list-row:hover{transform:translateX(2px)}
.stu-card-narrow{transition:.15s var(--ease)}
.stu-card-narrow:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,24,48,.08)}
.stu-detail-card{animation:fadeUp .35s var(--ease)}

/* ===== 微动效关键帧 ===== */
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes numPop{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-enter{animation:viewIn .4s var(--ease)}
.stagger>*{animation:fadeUp .45s var(--ease) both}

/* Toast 微缩放 */
.toast{transition:transform .28s var(--ease),opacity .28s;transform:translateX(-50%) translateY(80px) scale(.92)}
.toast.show{transform:translateX(-50%) translateY(0) scale(1)}

/* 自定义滚动条 */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#d6d9e2;border-radius:99px;border:3px solid var(--bg);background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#b7bccb;background-clip:padding-box}

/* 暗色模式下新变量的映射 */
[data-theme="dark"]{
  --gray-bg:#1c2027; --border:#2a2f3a; --text2:#9aa3b5;
  --grad-soft:linear-gradient(135deg,rgba(99,102,241,.22),rgba(139,92,246,.22));
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.35);
  --shadow-lg:0 22px 50px rgba(0,0,0,.55);
}
[data-theme="dark"] .stat-card .ico,[data-theme="dark"] .logo-icon{background:var(--grad)}
[data-theme="dark"] *::-webkit-scrollbar-thumb{background:#3a4150;background-clip:padding-box;border-color:#0f1115}
[data-theme="dark"] .nav-item:hover{background:var(--gray-bg)}
[data-theme="dark"] .stat-card:hover{box-shadow:var(--shadow-lg)}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">🎯</div>
      <div class="logo-text">求职辅导工作台<small>学员进度管理系统</small></div>
    </div>
    <button class="nav-item active" data-view="dashboard"><span class="ico">📊</span><span class="txt">仪表盘</span></button>
    <button class="nav-item" data-view="students"><span class="ico">🧑‍🎓</span><span class="txt">学员管理</span></button>
    <button class="nav-item" data-view="jobs"><span class="ico">💼</span><span class="txt">职位库</span></button>
    <button class="nav-item" data-view="pipeline"><span class="ico">🚀</span><span class="txt">投递进度</span></button>
    <div class="sidebar-footer">
      <div id="syncStatus" style="margin-bottom:10px;line-height:1.6">⚪️ 本地模式</div>
      <button id="migrateBtn" style="display:none" onclick="migrateLocal()">☁️ 迁移本地数据到飞书</button>
      <button id="repairBtn" style="display:none" onclick="repairTablesUI()">🛠️ 修复表结构（列缺失/类型不符）</button>
      <button onclick="exportCSV()">📊 导出 Excel(CSV)</button>
      <button onclick="openImpModal()">📥 批量导入 CSV</button>
      <button onclick="exportData()">⬇️ 导出数据备份</button>
      <button id="delLockBtn" style="display:none" onclick="toggleDelLock()">🔒 点击解锁删除权限</button>
      <button onclick="document.getElementById('importFile').click()">⬆️ 导入数据</button>
      <button onclick="toggleTheme()">🌓 切换深色 / 浅色</button>
      <button onclick="doLogout()">🚪 退出登录</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
      <span id="storageHint">数据保存在本机浏览器中</span>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <div class="topbar">
      <div class="crumb" id="crumb">仪表盘<small id="crumbSub"></small></div>
      <div class="global-search">
        <input class="gs-input" id="gsInput" placeholder="🔍 搜索学员 / 职位 / 公司…" oninput="globalSearch()" onfocus="globalSearch()">
        <div class="gs-results" id="gsResults"></div>
      </div>
    </div>
    <!-- 仪表盘 -->
    <section id="view-dashboard">
      <div class="page-head">
        <div><div class="page-title">仪表盘</div><div class="page-sub" id="dashDate"></div></div>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="followup" id="followUp"></div>
      <div class="dash-grid">
        <div class="panel">
          <div class="panel-head">📈 投递漏斗</div>
          <div class="panel-body" id="funnelBody"></div>
        </div>
        <div class="panel">
          <div class="panel-head">🧑‍🎓 学员阶段分布</div>
          <div class="panel-body" id="distBody"></div>
        </div>
        <div class="panel">
          <div class="panel-head">🕒 最近动态</div>
          <div class="panel-body" id="activityBody"></div>
        </div>
      </div>
    </section>

    <!-- 学员管理 -->
    <section id="view-students" style="display:none">
      <div class="page-head">
        <div><div class="page-title">学员管理</div><div class="page-sub">学员信息、简历与作品集</div></div>
        <button class="btn btn-primary" onclick="openStudentModal()">＋ 新增学员</button>
      </div>
      <div class="toolbar">
        <div class="search-box"><input id="stuSearch" placeholder="搜索姓名 / 学校 / 目标岗位" oninput="renderStudents()"></div>
        <select class="filter" id="stuStageFilter" onchange="renderStudents()">
          <option value="">全部阶段</option>
          <option>咨询中</option><option>辅导中</option><option>求职中</option><option>已上岸</option><option>暂停</option>
        </select>
        <select class="filter" id="stuResumeFilter" onchange="renderStudents()">
          <option value="">全部简历状态</option>
          <option>待优化</option><option>优化中</option><option>已定稿</option>
        </select>
        <div class="view-toggle"><button class="vt-btn active" data-v="table" onclick="setStuView('table')">▦ 表格</button><button class="vt-btn" data-v="card" onclick="setStuView('card')">▤ 卡片</button></div>
      </div>
      <div class="stu-master">
        <div class="stu-list-col card" style="overflow-x:auto;padding:14px"><div id="studentTable"></div></div>
        <div class="stu-detail-col" id="stuDetail"></div>
      </div>
    </section>

    <!-- 职位库 -->
    <section id="view-jobs" style="display:none">
      <div class="page-head">
        <div><div class="page-title">职位库</div><div class="page-sub">收集与维护可推荐的职位</div></div>
        <button class="btn btn-primary" onclick="openJobModal()">＋ 新增职位</button>
      </div>
      <div class="toolbar">
        <div class="search-box"><input id="jobSearch" placeholder="搜索公司 / 职位 / 城市" oninput="renderJobs()"></div>
        <select class="filter" id="jobStatusFilter" onchange="renderJobs()">
          <option value="">全部状态</option><option>招聘中</option><option>已关闭</option>
        </select>
      </div>
      <div class="card" style="overflow-x:auto"><div id="jobTable"></div></div>
    </section>

    <!-- 投递进度 -->
    <section id="view-pipeline" style="display:none">
      <div class="page-head">
        <div><div class="page-title">投递进度</div><div class="page-sub">拖拽卡片即可更新阶段</div></div>
        <button class="btn btn-primary" onclick="openAppModal()">＋ 新增投递</button>
      </div>
      <div class="toolbar">
        <select class="filter" id="pipeStudentFilter" onchange="renderPipeline()"><option value="">全部学员</option></select>
      </div>
      <div class="kanban" id="kanban"></div>
    </section>
  </main>
</div>

<!-- 学员弹窗 -->
<div class="modal-mask" id="studentModal">
  <div class="modal">
    <div class="modal-head"><h3 id="studentModalTitle">新增学员</h3><button class="modal-close" onclick="closeModal('studentModal')">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="fld"><label>姓名 *</label><input id="f_name"></div>
        <div class="fld"><label>联系方式（手机/微信）</label><input id="f_contact"></div>
        <div class="fld"><label>学校</label><input id="f_school"></div>
        <div class="fld"><label>专业</label><input id="f_major"></div>
        <div class="fld"><label>目标岗位</label><input id="f_target" placeholder="如：产品经理"></div>
        <div class="fld"><label>辅导阶段</label><select id="f_stage"><option>咨询中</option><option>辅导中</option><option>求职中</option><option>已上岸</option><option>暂停</option></select></div>
        <div class="fld"><label>简历状态</label><select id="f_resumeStatus"><option>待优化</option><option>优化中</option><option>已定稿</option></select></div>
        <div class="fld">
          <label>简历文件 / 链接</label>
          <input id="f_resumeUrl" placeholder="可粘贴网盘链接，或下方上传文件" style="margin-bottom:8px">
          <div class="upload-row">
            <button type="button" class="btn btn-sm" onclick="document.getElementById('f_resumeFile').click()">📎 上传简历文件</button>
            <input type="file" id="f_resumeFile" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.ppt,.pptx" style="display:none" onchange="handleResumeFile(this)">
            <span id="resumeUpStatus" class="up-status"></span>
          </div>
          <div id="resumeChip" class="file-chip" style="display:none"><a id="resumeChipLink" target="_blank"></a><button type="button" class="chip-x" onclick="clearResumeFile()" title="移除">✕</button></div>
        </div>
        <div class="fld full"><label>备注</label><textarea id="f_notes" placeholder="辅导重点、性格特点、期望薪资等"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('studentModal')">取消</button>
      <button class="btn btn-primary" onclick="saveStudent()">保存</button>
    </div>
  </div>
</div>

<!-- 职位弹窗 -->
<div class="modal-mask" id="jobModal">
  <div class="modal">
    <div class="modal-head"><h3 id="jobModalTitle">新增职位</h3><button class="modal-close" onclick="closeModal('jobModal')">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="fld"><label>公司 *</label><input id="j_company"></div>
        <div class="fld"><label>职位名称 *</label><input id="j_title"></div>
        <div class="fld"><label>城市</label><input id="j_city"></div>
        <div class="fld"><label>薪资范围</label><input id="j_salary" placeholder="如：20-35K·15薪"></div>
        <div class="fld"><label>渠道来源</label><input id="j_source" placeholder="如：Boss直聘 / 内推"></div>
        <div class="fld"><label>状态</label><select id="j_status"><option>招聘中</option><option>已关闭</option></select></div>
        <div class="fld full"><label>JD 链接</label><input id="j_link" placeholder="https://..."></div>
        <div class="fld full"><label>备注</label><textarea id="j_notes" placeholder="职位要求要点、内推人等"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('jobModal')">取消</button>
      <button class="btn btn-primary" onclick="saveJob()">保存</button>
    </div>
  </div>
</div>

<!-- 投递弹窗 -->
<div class="modal-mask" id="appModal">

let db = {students:[],jobs:[],apps:[]};
let MODE = 'local';        // 'local' 浏览器存储 ｜ 'feishu' 飞书多维表格
let delPwd = '';           // 已解锁的删除密码（内存态，刷新后失效）
let deleteProtected = false; // 后端是否启用了删除密码
let lastSync = null;       // 最近一次同步时间
let dragging = false;      // 拖拽中暂停自动刷新
const POLL_MS = 15000;     // 自动同步间隔（15 秒）

}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(db)); }

function today(){ return new Date().toISOString().slice(0,10); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

function seed(){
  const s1={id:'s1',name:'林晓雨',contact:'138****2211',school:'华南理工大学',major:'工业设计',target:'产品经理',stage:'求职中',resumeStatus:'已定稿',resumeUrl:'https://docs.qq.com/example-resume-lin',notes:'逻辑清晰，需加强项目量化表达。期望 18-25K，倾向大厂。',portfolio:[{id:'p1',title:'校园二手交易小程序 PRD',url:'https://docs.qq.com/example-prd'},{id:'p2',title:'B端 SaaS 竞品分析报告',url:'https://docs.qq.com/example-analysis'}],createdAt:daysAgo(45)};

  const s3={id:'s3',name:'王佳怡',contact:'137****8876',school:'中山大学',major:'金融学',target:'数据分析师',stage:'辅导中',resumeStatus:'待优化',resumeUrl:'',notes:'转行数据分析，SQL 已过关，Python 学习中。计划 9 月开始投递。',portfolio:[],createdAt:daysAgo(12)};

  const j1={id:'j1',company:'字节跳动',title:'产品经理（教育方向）',city:'深圳',salary:'25-40K·15薪',source:'内推',status:'招聘中',link:'https://jobs.bytedance.com/example',notes:'内推人：张老师；重视数据敏感度'};
  const j2={id:'j2',company:'腾讯',title:'前端开发工程师',city:'深圳',salary:'25-45K·16薪',source:'官网',status:'招聘中',link:'https://careers.tencent.com/example',notes:'要求熟悉 React / 小程序'};

  const j5={id:'j5',company:'某跨境电商独角兽',title:'高级前端工程师',city:'广州',salary:'30-50K·14薪',source:'内推',status:'已关闭',link:'',notes:'HC 已关闭，10月可能重开'};
  const apps=[

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }
/* 数字滚动动画（easeOutCubic） */
function countUp(el){
  const target=+el.dataset.target||0;
  if(target===0){ el.textContent='0'; return; }
  const dur=850, start=performance.now();
  function step(now){
    const p=Math.min(1,(now-start)/dur);
    const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e);
    if(p<1) requestAnimationFrame(step);
    else el.textContent=target;
  }
  el.style.animation='numPop .4s var(--ease)';
  requestAnimationFrame(step);
}
function stuById(id){ return db.students.find(s=>s.id===id); }
function jobById(id){ return db.jobs.find(j=>j.id===id); }
function avatarOf(s,size){ const idx=[...s.id].reduce((a,c)=>a+c.charCodeAt(0),0)%AVATAR_COLORS.length; const sz=size?`;width:${size}px;height:${size}px;font-size:${Math.round(size*0.48)}px`:''; return `<span class="avatar" style="background:${AVATAR_COLORS[idx]}${sz}">${esc(s.name[0]||'?')}</span>`; }
function closeModal(id){ $(id).classList.remove('show'); }
function openModalEl(id){ $(id).classList.add('show'); }
document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m && m.id!=='loginModal') m.classList.remove('show'); }));

/* ================= 飞书同步层 ================= */
async function api(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!j.ok){ const e=new Error(j.error||'操作失败'); e.needDeletePwd=!!j.needDeletePwd; throw e; }
  return j;
}
async function fetchRemote(){
  const r=await fetch('/api/data',{cache:'no-store',credentials:'same-origin'});
  return r.json();
}
async function refreshData(){
  if(MODE!=='feishu') return;
  const j=await fetchRemote();
  if(j.ok){ db=j.data; lastSync=new Date(); deleteProtected=!!j.deleteProtected; updateSyncUI(); updateDelBtn(); }
  else throw new Error(j.error);
}
// 保存后只把改动的那一条合并进本地数据，避免整表重新拉取（省 3 次请求、反应更快）
function mergeSaved(type, id, obj){
  const merged={id, ...obj};
  if(type==='student'){
    const i=db.students.findIndex(s=>s.id===id);
    if(i>=0) db.students[i]={...db.students[i],...merged}; else db.students.push(merged);
  } else if(type==='job'){
    const i=db.jobs.findIndex(j=>j.id===id);
    if(i>=0) db.jobs[i]={...db.jobs[i],...merged}; else db.jobs.push(merged);
  } else if(type==='app'){
    const i=db.apps.findIndex(a=>a.id===id);
    if(i>=0) db.apps[i]={...db.apps[i],...merged}; else db.apps.push(merged);
  }
  lastSync=new Date(); updateSyncUI();
}
async function feishuSave(type, id, data, derived){
  const j=await api('/api/save',{type,id,data});
  const newId=id||j.id;
  mergeSaved(type, newId, Object.assign({}, data, derived||{}));
  return newId;
}
function updateSyncUI(){
  const el=$('syncStatus');
  if(MODE==='feishu'){
    const t=lastSync?`${String(lastSync.getHours()).padStart(2,'0')}:${String(lastSync.getMinutes()).padStart(2,'0')}:${String(lastSync.getSeconds()).padStart(2,'0')}`:'-';
    el.className='feishu';
    el.innerHTML=`<span class="sdot"></span><div>已连接飞书表格<br><span style="color:var(--text2);font-weight:400">自动同步 · 上次 ${t}</span></div>`;
    $('migrateBtn').style.display='';
    $('repairBtn').style.display='';
    $('storageHint').textContent='数据存储于飞书多维表格';
  }else{
    el.className='';
    el.innerHTML='<span class="sdot"></span><div>本地模式<br><span style="color:var(--text2);font-weight:400">未连接飞书</span></div>';
    $('migrateBtn').style.display='none';
    $('repairBtn').style.display='none';
    $('storageHint').textContent='数据保存在本机浏览器中';
  }
}
function uiBusy(){
  return dragging || document.querySelector('.modal-mask.show') || $('drawer').classList.contains('show');
}
function currentView(){ return views.find(v=>$('view-'+v).style.display!=='none')||'dashboard'; }
function rerenderCurrent(){
  const v=currentView();
  if(v==='dashboard') renderDashboard();
  if(v==='students') renderStudents();
  if(v==='jobs') renderJobs();
  if(v==='pipeline') renderPipeline();
}
function startPolling(){
  setInterval(async()=>{
    if(uiBusy()) return;
    try{
      const j=await fetchRemote();
      if(j.ok){
        lastSync=new Date();
        if(JSON.stringify(j.data)!==JSON.stringify(db)){ db=j.data; rerenderCurrent(); toast('已从飞书同步最新数据'); }
        updateSyncUI();
      }
    }catch(e){}
  },POLL_MS);
}
function showLogin(){ $('loginModal').classList.add('show'); }
async function doLogin(){
  const pwd=$('loginPwd').value;
  if(!pwd){ $('loginErr').textContent='请输入访问口令'; return; }
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
    const j=await r.json().catch(()=>({}));
    if(j.ok){ $('loginModal').classList.remove('show'); $('loginErr').textContent=''; init(); }
    else{ $('loginErr').textContent=j.error||'登录失败'; }
  }catch(e){ $('loginErr').textContent='网络错误，请稍后再试'; }
}
async function doLogout(){
  try{ await fetch('/api/logout',{method:'POST'}); }catch(e){}
  await init();
  if(!$('loginModal').classList.contains('show')) toast('已退出登录');
}
async function init(){
  applyTheme(localStorage.getItem('theme')||'light');
  let r;
  try{ r=await fetch('/api/data',{cache:'no-store',credentials:'same-origin'}); }catch(e){ r=null; }
  if(r && r.status===401){ showLogin(); return; }
  try{
    const j=r?await r.json():{};
    if(j.ok){ MODE='feishu'; db=j.data; lastSync=new Date(); deleteProtected=!!j.deleteProtected; startPolling(); updateDelBtn(); }
    else{ MODE='local'; db=load(); console.warn('飞书未就绪：',j.error); toast(j.error); }
  }catch(e){ MODE='local'; db=load(); }
  updateSyncUI();
  renderDashboard();
  const dash=$('view-dashboard'); if(dash){ dash.classList.remove('view-enter'); void dash.offsetWidth; dash.classList.add('view-enter'); }
}
/* 兼容：投递记录在飞书中按姓名/公司职位关联，可能存在未匹配的情况 */
function appStu(a){ return stuById(a.studentId)||{id:'x'+(a.studentName||'?'),name:a.studentName||'?'}; }
function appJobInfo(a){ return jobById(a.jobId)||{company:a.company||'?',title:a.jobTitle||'(职位未匹配)',city:''}; }
function appsOfStudent(s){ return db.apps.filter(a=>a.studentId===s.id||(MODE==='feishu'&&a.studentName&&a.studentName===s.name)); }
function appsOfJob(j){ return db.apps.filter(a=>a.jobId===j.id||(MODE==='feishu'&&a.company===j.company&&a.jobTitle===j.title)); }
async function migrateLocal(){
  let local=null;
  try{ local=JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(!local||(!local.students?.length&&!local.jobs?.length)){ toast('本地没有可迁移的数据'); return; }
  if(!confirm(`将本地 ${local.students.length} 名学员、${local.jobs.length} 个职位、${local.apps.length} 条投递复制到飞书表格？\n（不会删除本地备份，重复执行会产生重复数据）`)) return;
  try{
    await api('/api/migrate',local);
    await refreshData(); rerenderCurrent();
    toast('迁移完成 ✅');
  }catch(e){ toast('迁移失败：'+e.message); }
}
async function repairTablesUI(){
  if(MODE!=='feishu'){ toast('仅飞书模式需要修复表结构'); return; }

/* ================= 仪表盘 ================= */
function renderDashboard(){
  const w=['日','一','二','三','四','五','六'];
  const n=new Date();
  $('dashDate').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${w[n.getDay()]} · 今天也要帮学员往前推一步`;
  const activeApps=db.apps.filter(a=>a.stage!=='未通过');
  const weekAgo=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  const stats=[
    {ico:'🧑‍🎓',lbl:'学员总数',num:db.students.length,color:'#6366f1'},
    {ico:'🔥',lbl:'在辅导中',num:db.students.filter(s=>s.stage!=='已上岸'&&s.stage!=='暂停').length,color:'#d97706'},
    {ico:'🏆',lbl:'已上岸',num:db.students.filter(s=>s.stage==='已上岸').length,color:'#059669'},
    {ico:'🆕',lbl:'本周新增',num:db.students.filter(s=>(s.createdAt||'')>=weekAgo).length,color:'#2563eb'},
    {ico:'📮',lbl:'投递总数',num:db.apps.length,color:'#0891b2'},
    {ico:'🎤',lbl:'面试中',num:db.apps.filter(a=>a.stage==='面试').length,color:'#7c3aed'},
    {ico:'✉️',lbl:'Offer 数',num:db.apps.filter(a=>a.stage==='Offer').length,color:'#059669'}
  ];
  const maxNum=Math.max(1,...stats.map(s=>s.num));
  $('statsGrid').innerHTML=stats.map((s,i)=>`<div class="stat-card" style="animation-delay:${i*55}ms"><span class="ico">${s.ico}</span><div class="num" data-target="${s.num}" style="color:${s.color}">0</div><div class="lbl">${s.lbl}</div><div class="stat-bar"><i style="width:${Math.round(s.num/maxNum*100)}%;background:${s.color}"></i></div></div>`).join('');
  document.querySelectorAll('#statsGrid .stat-card .num').forEach(countUp);

  const counts=STAGES.map(st=>({st,c:db.apps.filter(a=>a.stage===st).length}));
  const max=Math.max(1,...counts.map(x=>x.c));
  let funnel=counts.map((x,i)=>{
    let row=`<div class="funnel-row"><div class="funnel-label">${x.st}</div><div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${x.c/max*100}%;background:${STAGE_COLOR[x.st]}"></div></div><div class="funnel-num">${x.c}</div></div>`;
    if(i<counts.length-1){
      const prev=counts[i].c, next=counts[i+1].c;
      const pct= prev>0?Math.round(next/prev*100):0;
      row+=`<div class="funnel-conv">↓ 环节转化 <b>${pct}%</b></div>`;
    }
    return row;
  }).join('');
  const delivered=counts[1].c, offer=counts[4].c, overall=delivered>0?Math.round(offer/delivered*100):0;
  funnel+=`<div class="funnel-overall">整体投递→Offer 转化率 <b>${overall}%</b>　<span>（${delivered} 投递 → ${offer} Offer）</span></div>`;
  $('funnelBody').innerHTML=funnel || '<div class="empty">暂无投递数据</div>';

  const STU_DIST=['咨询中','辅导中','求职中','已上岸','暂停'];
  const STU_DIST_COLOR={'咨询中':'#60a5fa','辅导中':'#6366f1','求职中':'#d97706','已上岸':'#059669','暂停':'#9ca3af'};
  const distMax=Math.max(1,...STU_DIST.map(st=>db.students.filter(s=>s.stage===st).length));
  $('distBody').innerHTML=STU_DIST.map(st=>{
    const c=db.students.filter(s=>s.stage===st).length;
    return `<div class="dist-row"><div class="lbl">${st}</div><div class="dist-bar"><i style="width:${Math.round(c/distMax*100)}%;background:${STU_DIST_COLOR[st]}"></i></div><div class="dist-num">${c}</div></div>`;
  }).join('') + `<div style="margin-top:12px;font-size:12px;color:var(--text2)">共 ${db.students.length} 名学员</div>`;

  const recent=[...db.apps].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,8);
  $('activityBody').innerHTML=recent.length?recent.map(a=>{
    const s=appStu(a),j=appJobInfo(a);
    return `<div class="activity-item"><span class="tag ${STAGE_TAG[a.stage]}">${a.stage}</span><div style="flex:1"><b>${esc(s.name)}</b> · ${esc(j.company)}｜${esc(j.title)}${a.next?`<div style="color:var(--amber);font-size:12px;margin-top:2px">⏭ ${esc(a.next)}</div>`:''}</div><span class="activity-time">${a.updatedAt||''}</span></div>`;
  }).join(''):'<div class="empty">暂无动态</div>';
  renderFollowUp();
}
function renderFollowUp(){
  const items=db.apps.filter(a=>{
    if(a.stage==='未通过'||a.stage==='Offer') return false;
    return (a.followUpDate||'').trim().length>0 || (a.next||'').trim().length>0;
  });
  items.sort((a,b)=>{
    const ad=a.followUpDate||'', bd=b.followUpDate||'';
    if(ad&&bd) return ad.localeCompare(bd);
    if(ad&&!bd) return -1;
    if(!ad&&bd) return 1;
    return (a.updatedAt||'').localeCompare(b.updatedAt||'');
  }).slice(0,16);
  const el=$('followUp');
  if(!items.length){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML=`<div class="fu-left"><div class="fu-num">${items.length}</div><div class="fu-lbl">待跟进</div></div><div class="fu-list">${items.map(a=>{
    const s=appStu(a),j=appJobInfo(a);
    const dd=a.followUpDate?followDateInfo(a.followUpDate):null;
    const dateChip=dd?`<span class="fu-date ${dd.cls}">📅 ${dd.txt}</span>`:`<span class="fu-date none">无日期</span>`;
    return `<div class="fu-item" onclick="gsGo('app','${a.id}')">
      <div class="fn">${esc(s.name)} · ${esc(j.company)}</div>
      <div class="fd">${esc(j.title)}｜当前：${a.stage}</div>
      ${a.next?`<div class="ft">⏭ ${esc(a.next)}</div>`:''}
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        ${dateChip}
        <button class="fu-done" onclick="event.stopPropagation();completeFollowUp('${a.id}')">完成 ✓</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function followDateInfo(d){
  if(!d) return null;
  const t=new Date(d.replace(/-/g,'/')).getTime();
  const base=new Date(); base.setHours(0,0,0,0);
  const diff=Math.round((t-base.getTime())/86400000);
  if(diff<0) return {txt:`逾期 ${-diff} 天`, cls:'overdue'};
  if(diff===0) return {txt:'今天截止', cls:'today'};
  if(diff<=3) return {txt:`还有 ${diff} 天`, cls:'soon'};
  return {txt:`${diff} 天后`, cls:''};
}
async function completeFollowUp(id){
  const a=db.apps.find(x=>x.id===id); if(!a) return;
  if(!confirm('标记该跟进已完成？将清除其「下一步行动」与「跟进日期」。')) return;
  try{
    const data={...a, next:'', followUpDate:'', updatedAt:today()};
    if(MODE==='feishu'){
      const s=stuById(a.studentId), jb=jobById(a.jobId);
      await feishuSave('app', id, data, { studentName: s?s.name:'', company: jb?jb.company:'', jobTitle: jb?jb.title:'' });
    }else{ Object.assign(a,data); save(); }
    toast('已标记完成');
    renderDashboard();
  }catch(e){ toast('操作失败：'+e.message); }
}

let editingStudentId=null;
let pendingResume=null; // {url,name}
let pendingPf=null;
async function uploadFile(file, kind){
  const statusEl = kind==='resume' ? $('resumeUpStatus') : $('pfUpStatus');
  if(statusEl) statusEl.textContent='上传中…';
  try{
    const res = await fetch('/api/upload?name='+encodeURIComponent(file.name)+'&kind='+kind, { method:'POST', body: file });
    const d = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(d.error||'上传失败');
    return { url:d.url, name:d.name||file.name };
  } finally { if(statusEl) statusEl.textContent=''; }
}
function handleResumeFile(input){
  const file=input.files&&input.files[0]; if(!file) return;
  uploadFile(file,'resume').then(r=>{ pendingResume=r; $('f_resumeUrl').value=r.url; showResumeChip(r); toast('简历已上传'); })
    .catch(e=>{ toast('上传失败：'+e.message); });
}
function showResumeChip(r){
  $('resumeChip').style.display='flex';
  const a=$('resumeChipLink'); a.href=r.url; a.textContent='📄 '+(r.name||'简历文件');
}
function clearResumeFile(){ pendingResume=null; $('f_resumeUrl').value=''; $('resumeChip').style.display='none'; const f=$('f_resumeFile'); if(f) f.value=''; }
function handlePfFile(input){

  uploadFile(file,'portfolio').then(r=>{ pendingPf=r; $('p_url').value=r.url; showPfChip(r); toast('文件已上传'); })
    .catch(e=>{ toast('上传失败：'+e.message); });

async function saveStudent(){
  const name=$('f_name').value.trim();
  if(!name){ toast('请填写学员姓名'); return; }
  const resumeName = pendingResume ? pendingResume.name : (editingStudentId ? (stuById(editingStudentId).resumeName||'') : '');
  const data={name,contact:$('f_contact').value.trim(),school:$('f_school').value.trim(),major:$('f_major').value.trim(),target:$('f_target').value.trim(),stage:$('f_stage').value,resumeStatus:$('f_resumeStatus').value,resumeUrl:$('f_resumeUrl').value.trim(),resumeName,notes:$('f_notes').value.trim()};
  try{
    if(MODE==='feishu'){
      const old=editingStudentId?stuById(editingStudentId):null;
      const full={...(old||{portfolio:[],createdAt:today()}),...data};
      await feishuSave('student', editingStudentId, full);
    }else{
      if(editingStudentId) Object.assign(stuById(editingStudentId),data);
      else db.students.push({id:uid(),portfolio:[],createdAt:today(),...data});
      save();
    }
    toast(editingStudentId?'学员信息已更新':'学员已添加');
    closeModal('studentModal'); renderStudents();
    if(drawerStudentId&&stuById(drawerStudentId)) openDrawer(drawerStudentId);
  }catch(e){ toast('保存失败：'+e.message); }
}
/* ================= 删除密码（删除需密码，新增/编辑无需） ================= */
let _delResolve=null,_delReject=null;
function ensureDelPwd(){
  return new Promise((resolve,reject)=>{
    if(!deleteProtected) return resolve();        // 未启用删除密码则直接放行
    if(delPwd) return resolve();                   // 本次会话已解锁
    _delResolve=resolve; _delReject=reject;
    const inp=$('delPwdInput'); inp.value=''; $('delPwdErr').textContent='';
    openModalEl('delPwdModal');
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} },50);
  });
}
function confirmDelPwd(){
  const v=$('delPwdInput').value;
  if(!v){ $('delPwdErr').textContent='请输入删除密码'; return; }
  delPwd=v; closeModal('delPwdModal');
  const r=_delResolve; _delResolve=null; if(r) r();
}
function cancelDelPwd(){
  const r=_delReject; _delReject=null; _delResolve=null;
  closeModal('delPwdModal');
  if(r) r(new Error('已取消删除'));
}
function toggleDelLock(){
  if(delPwd){ delPwd=''; updateDelBtn(); toast('已锁定删除权限'); }
  else ensureDelPwd().then(updateDelBtn);
}
function updateDelBtn(){
  const b=$('delLockBtn'); if(!b) return;
  if(!deleteProtected){ b.style.display='none'; return; }
  b.style.display='';
  b.innerHTML = delPwd ? '🔓 删除已授权（点击锁定）' : '🔒 点击解锁删除权限';
}
// 带删除密码的删除（云端模式）；密码错误自动清空并重新索取，最多重试 1 次
async function deleteWithPwd(payload){
  for(let attempt=0;attempt<2;attempt++){
    await ensureDelPwd();
    try{
      await api('/api/delete',{...payload,deletePassword:delPwd});
      return;
    }catch(e){
      if(e.needDeletePwd){ delPwd=''; updateDelBtn(); continue; }
      throw e;
    }
  }
  throw new Error('删除密码错误');
}

async function deleteStudent(id){
  const s=stuById(id);
  const n=appsOfStudent(s).length;
  if(!confirm(`确定删除学员「${s.name}」？${n?`\n其名下 ${n} 条投递记录也将一并删除。`:''}`)) return;
  try{
    if(MODE==='feishu'){
      await deleteWithPwd({type:'student',id});
      await refreshData();
    }else{
      db.students=db.students.filter(x=>x.id!==id);
      db.apps=db.apps.filter(a=>a.studentId!==id);
      save();
    }
    renderStudents(); toast('已删除');
  }catch(e){ if(!e.needDeletePwd) toast('删除失败：'+e.message); }
}

        </div>`;
      }).join('')}</div>
    </div>`;
  }).join('');

function bindDragDrop(){
  let draggedId=null;
  document.querySelectorAll('.kb-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{ draggedId=card.dataset.id; dragging=true; card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend',()=>{ dragging=false; card.classList.remove('dragging'); });
  });
  document.querySelectorAll('.kb-col').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',async e=>{
      e.preventDefault(); col.classList.remove('drag-over');
      if(!draggedId) return;
      const app=db.apps.find(a=>a.id===draggedId);
      const newStage=col.dataset.stage;
      draggedId=null; dragging=false;
      if(app&&app.stage!==newStage){
        const oldStage=app.stage;
        app.stage=newStage; app.updatedAt=today();
        if(newStage==='已投递'&&!app.appliedAt) app.appliedAt=today();
        renderPipeline();
        try{
          if(MODE==='feishu'){ await feishuSave('app', app.id, app); renderPipeline(); }
          else save();
          toast(`已更新为「${newStage}」`);
        }catch(err){
          app.stage=oldStage; renderPipeline();
          toast('同步失败：'+err.message);
        }
      }
    });
  });
}
async function changeStage(id,newStage){
  const app=db.apps.find(a=>a.id===id);
  if(!app||app.stage===newStage) return;
  const oldStage=app.stage;
  app.stage=newStage; app.updatedAt=today();
  if(newStage==='已投递'&&!app.appliedAt) app.appliedAt=today();
  renderPipeline();
  try{

    toast(`已更新为「${newStage}」`);
  }catch(err){
    app.stage=oldStage; renderPipeline();
    toast('同步失败：'+err.message);
  }
}

/* ================= 批量导入 CSV ================= */
function openImpModal(){ $('impText').value=''; $('impPreview').innerHTML=''; impPreview(); openModalEl('impModal'); }
function impColumns(type){
  return type==='student'
    ? ['姓名','联系方式','学校','专业','目标岗位','辅导阶段','简历状态','备注','加入日期']
    : ['公司','职位名称','城市','薪资','渠道','状态','JD链接','备注'];
}
function parseCSV(text){
  const rows=[]; let i=0, field='', row=[], inQ=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
    i++;
  }
  if(field.length>0||row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function impPreview(){
  const type=$('impType').value;
  const cols=impColumns(type);
  $('impHint').textContent='表头需含：'+cols.join('、');
  const text=$('impText').value.trim();
  if(!text){ $('impPreview').innerHTML=''; return; }
  const rows=parseCSV(text);
  if(rows.length<2){ $('impPreview').innerHTML='<span style="color:#dc2626">未解析到数据行（需要表头 + 至少一行）</span>'; return; }
  const headers=rows[0].map(h=>h.trim());
  const missing=cols.filter(c=>!headers.includes(c));
  const n=rows.length-1;
  let html=`检测到 <b style="color:var(--text)">${n}</b> 条数据`;
  if(missing.length) html+=` · <span style="color:#dc2626">缺列：${missing.join('、')}（留空或用默认值）</span>`;
  else html+=` · <span style="color:#059669">列匹配完整 ✓</span>`;
  $('impPreview').innerHTML=html;
}
async function importCSV(){
  const type=$('impType').value;
  const text=$('impText').value.trim();
  if(!text){ toast('请先粘贴 CSV 内容'); return; }
  const rows=parseCSV(text);
  if(rows.length<2){ toast('未解析到数据行'); return; }
  const headers=rows[0].map(h=>h.trim());
  const recs=rows.slice(1).map(r=>{ const o={}; headers.forEach((h,idx)=>o[h]=(r[idx]||'').trim()); return o; });
  let ok=0, fail=0;
  try{
    for(const o of recs){
      if(type==='student'){
        if(!o['姓名']){ fail++; continue; }
        const stage=['咨询中','辅导中','求职中','已上岸','暂停'].includes(o['辅导阶段'])?o['辅导阶段']:'咨询中';
        const resume=['待优化','优化中','已定稿'].includes(o['简历状态'])?o['简历状态']:'待优化';
        const data={name:o['姓名'],contact:o['联系方式']||'',school:o['学校']||'',major:o['专业']||'',target:o['目标岗位']||'',stage,resumeStatus:resume,notes:o['备注']||'',createdAt:o['加入日期']||today(),portfolio:[]};
        if(MODE==='feishu') await feishuSave('student', null, data); else db.students.push({id:uid(),...data});
        ok++;
      } else {
        if(!o['公司']||!o['职位名称']){ fail++; continue; }
        const status=['招聘中','已关闭'].includes(o['状态'])?o['状态']:'招聘中';
        const data={company:o['公司'],title:o['职位名称'],city:o['城市']||'',salary:o['薪资']||'',source:o['渠道']||'',status,link:o['JD链接']||'',notes:o['备注']||''};
        if(MODE==='feishu') await feishuSave('job', null, data); else db.jobs.push({id:uid(),...data});
        ok++;
      }
    }
    if(MODE!=='feishu') save();
    closeModal('impModal');
    toast(`导入完成：成功 ${ok} 条${fail?` · 跳过 ${fail} 条（缺必填项）`:''}`);
    renderDashboard(); rerenderCurrent();
  }catch(e){ toast('导入失败：'+e.message); }
}

/* ================= 初始化 ================= */
init();
</script>
</body>
</html>
